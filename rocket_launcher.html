<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Rocket Launcher Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #0a0a2e 0%, #1a1a4e 50%, #2d1b4e 100%);
            min-height: 100vh;
        }

        #gameCanvas {
            display: block;
            cursor: crosshair;
        }

        .control-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 60, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            display: flex;
            gap: 30px;
            align-items: center;
            border: 2px solid rgba(100, 200, 255, 0.3);
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.2);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .control-label {
            color: #88ccff;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-value {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.5);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 150px;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #ff6b6b, #ffd93d, #6bcf63);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .launch-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 65, 108, 0.5);
        }

        .launch-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(255, 65, 108, 0.8);
        }

        .launch-btn:active {
            transform: scale(0.95);
        }

        .launch-btn:disabled {
            background: linear-gradient(135deg, #666, #444);
            cursor: not-allowed;
            box-shadow: none;
        }

        .stats-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 60, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid rgba(100, 200, 255, 0.3);
            color: white;
            min-width: 200px;
        }

        .stats-panel h3 {
            color: #88ccff;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .stat-label {
            color: #aaa;
        }

        .stat-value {
            color: #6bcf63;
            font-weight: bold;
        }

        .title {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.8);
            letter-spacing: 4px;
        }

        .instructions {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: center;
        }

        .rocket-type-selector {
            display: flex;
            gap: 10px;
        }

        .rocket-type-btn {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            border: 2px solid rgba(100, 200, 255, 0.3);
            background: rgba(40, 40, 80, 0.8);
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
        }

        .rocket-type-btn.active {
            border-color: #ff416c;
            box-shadow: 0 0 15px rgba(255, 65, 108, 0.5);
            transform: scale(1.1);
        }

        .rocket-type-btn:hover {
            transform: scale(1.1);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 150px;
            font-weight: bold;
            color: #ff416c;
            text-shadow: 0 0 50px rgba(255, 65, 108, 0.8);
            z-index: 100;
            animation: pulse 0.5s ease-in-out;
        }

        .explosion-text {
            position: fixed;
            font-size: 60px;
            font-weight: bold;
            color: #ffd93d;
            text-shadow: 0 0 30px rgba(255, 217, 61, 0.8);
            pointer-events: none;
            animation: explodeText 1s ease-out forwards;
        }

        @keyframes explodeText {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="title">🚀 ROCKET LAUNCHER 🚀</div>
    <div class="instructions">Set power & angle, then click LAUNCH! Click anywhere to set target 🎯</div>
    
    <div class="stats-panel">
        <h3>📊 Flight Stats</h3>
        <div class="stat-row">
            <span class="stat-label">Altitude:</span>
            <span class="stat-value" id="altitude">0 m</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Distance:</span>
            <span class="stat-value" id="distance">0 m</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Speed:</span>
            <span class="stat-value" id="speed">0 m/s</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Max Height:</span>
            <span class="stat-value" id="maxHeight">0 m</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Launches:</span>
            <span class="stat-value" id="launches">0</span>
        </div>
    </div>
    
    <div class="control-panel">
        <div class="control-group">
            <span class="control-label">Rocket Type</span>
            <div class="rocket-type-selector">
                <button class="rocket-type-btn active" data-type="0">🚀</button>
                <button class="rocket-type-btn" data-type="1">🎆</button>
                <button class="rocket-type-btn" data-type="2">🛸</button>
            </div>
        </div>
        
        <div class="control-group">
            <span class="control-label">Power</span>
            <input type="range" id="power" min="20" max="100" value="60">
            <span class="control-value" id="powerValue">60%</span>
        </div>
        
        <div class="control-group">
            <span class="control-label">Angle</span>
            <input type="range" id="angle" min="10" max="90" value="45">
            <span class="control-value" id="angleValue">45°</span>
        </div>
        
        <button class="launch-btn" id="launchBtn">🔥 LAUNCH!</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Game state
        let rockets = [];
        let particles = [];
        let stars = [];
        let clouds = [];
        let target = null;
        let launchCount = 0;
        let maxHeightReached = 0;
        let selectedRocketType = 0;
        let isLaunching = false;

        // Audio System using Web Audio API
        const AudioSystem = {
            ctx: null,

            init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },

            ensureContext() {
                if (!this.ctx) this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },

            // Countdown beep - ascending pitch
            playCountdownBeep(count) {
                this.ensureContext();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                // Higher pitch as countdown progresses (3=low, 1=high, 0=highest)
                const frequencies = { 3: 440, 2: 554, 1: 659, 0: 880 };
                osc.frequency.value = frequencies[count] || 880;
                osc.type = 'sine';

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialDecayTo = 0.01;
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            },

            // Launch ignition sound
            playLaunch() {
                this.ensureContext();
                const duration = 1.5;

                // White noise for thrust
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                // Low frequency rumble
                const osc = this.ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + duration);

                const noiseGain = this.ctx.createGain();
                const oscGain = this.ctx.createGain();
                const masterGain = this.ctx.createGain();

                noiseGain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

                oscGain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                oscGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

                masterGain.gain.value = 0.5;

                noise.connect(noiseGain);
                osc.connect(oscGain);
                noiseGain.connect(masterGain);
                oscGain.connect(masterGain);
                masterGain.connect(this.ctx.destination);

                noise.start();
                osc.start();
                noise.stop(this.ctx.currentTime + duration);
                osc.stop(this.ctx.currentTime + duration);
            },

            // Explosion sound
            playExplosion() {
                this.ensureContext();
                const duration = 0.8;

                // Noise burst
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                // Low boom
                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.5);

                const noiseGain = this.ctx.createGain();
                const oscGain = this.ctx.createGain();

                noiseGain.gain.setValueAtTime(0.6, this.ctx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

                oscGain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                oscGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);

                // Filter for more boom-like sound
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + duration);

                noise.connect(noiseGain);
                osc.connect(oscGain);
                noiseGain.connect(filter);
                oscGain.connect(filter);
                filter.connect(this.ctx.destination);

                noise.start();
                osc.start();
                noise.stop(this.ctx.currentTime + duration);
                osc.stop(this.ctx.currentTime + duration);
            },

            // Bullseye celebration sound
            playBullseye() {
                this.ensureContext();

                // Play a victory jingle - ascending arpeggio
                const notes = [523, 659, 784, 1047]; // C5, E5, G5, C6

                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'sine';
                    osc.frequency.value = freq;

                    const startTime = this.ctx.currentTime + i * 0.1;
                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.4);

                    osc.start(startTime);
                    osc.stop(startTime + 0.4);
                });

                // Add a final sparkle
                setTimeout(() => {
                    for (let i = 0; i < 3; i++) {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);

                        osc.type = 'sine';
                        osc.frequency.value = 1200 + Math.random() * 800;

                        const startTime = this.ctx.currentTime + i * 0.05;
                        gain.gain.setValueAtTime(0.15, startTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);

                        osc.start(startTime);
                        osc.stop(startTime + 0.2);
                    }
                }, 400);
            }
        };

        // Initialize audio on first user interaction
        document.addEventListener('click', () => AudioSystem.ensureContext(), { once: true });
        
        // Rocket types configuration
        const rocketTypes = [
            { emoji: '🚀', name: 'Classic', trailColor: '#ff6b6b', explosionColors: ['#ff6b6b', '#ffd93d', '#ff9f43'] },
            { emoji: '🎆', name: 'Firework', trailColor: '#ff00ff', explosionColors: ['#ff00ff', '#00ffff', '#ffff00', '#ff69b4'] },
            { emoji: '🛸', name: 'UFO', trailColor: '#00ff88', explosionColors: ['#00ff88', '#00ffff', '#88ff00'] }
        ];
        
        // Generate stars
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight * 0.7,
                size: Math.random() * 2 + 0.5,
                twinkle: Math.random() * Math.PI * 2
            });
        }
        
        // Generate clouds
        for (let i = 0; i < 5; i++) {
            clouds.push({
                x: Math.random() * window.innerWidth,
                y: 100 + Math.random() * 150,
                width: 100 + Math.random() * 100,
                speed: 0.2 + Math.random() * 0.3
            });
        }
        
        // Rocket class
        class Rocket {
            constructor(x, y, power, angle, type) {
                this.x = x;
                this.y = y;
                this.startX = x;
                this.startY = y;
                const radians = (90 - angle) * Math.PI / 180;
                const velocity = power * 0.15;
                this.vx = Math.cos(radians) * velocity;
                this.vy = -Math.sin(radians) * velocity;
                this.gravity = 0.05;
                this.trail = [];
                this.alive = true;
                this.type = type;
                this.rotation = -angle * Math.PI / 180;
                this.maxHeight = y;
                this.hasExploded = false;
            }
            
            update() {
                if (!this.alive) return;
                
                // Store trail
                this.trail.push({ x: this.x, y: this.y, alpha: 1 });
                if (this.trail.length > 30) this.trail.shift();
                
                // Update trail alpha
                this.trail.forEach((point, i) => {
                    point.alpha = (i / this.trail.length) * 0.8;
                });
                
                // Physics
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                
                // Update rotation based on velocity
                this.rotation = Math.atan2(this.vy, this.vx);
                
                // Track max height
                if (this.y < this.maxHeight) {
                    this.maxHeight = this.y;
                }
                
                // Create smoke particles
                if (Math.random() > 0.5) {
                    particles.push(new Particle(
                        this.x - this.vx * 2,
                        this.y - this.vy * 2,
                        'smoke'
                    ));
                }
                
                // Check if hit ground or target
                if (this.y > canvas.height - 50) {
                    this.explode();
                }
                
                // Check target hit
                if (target && !this.hasExploded) {
                    const dist = Math.hypot(this.x - target.x, this.y - target.y);
                    if (dist < 40) {
                        this.explode();
                        showCelebration(target.x, target.y);
                    }
                }
            }
            
            explode() {
                if (this.hasExploded) return;
                this.hasExploded = true;
                this.alive = false;

                // Play explosion sound
                AudioSystem.playExplosion();

                const colors = rocketTypes[this.type].explosionColors;
                
                // Create explosion particles
                for (let i = 0; i < 60; i++) {
                    const angle = (Math.PI * 2 / 60) * i;
                    const speed = 2 + Math.random() * 4;
                    particles.push(new Particle(
                        this.x,
                        this.y,
                        'explosion',
                        Math.cos(angle) * speed,
                        Math.sin(angle) * speed,
                        colors[Math.floor(Math.random() * colors.length)]
                    ));
                }
                
                // Create sparkles
                for (let i = 0; i < 30; i++) {
                    particles.push(new Particle(
                        this.x + (Math.random() - 0.5) * 50,
                        this.y + (Math.random() - 0.5) * 50,
                        'sparkle',
                        (Math.random() - 0.5) * 3,
                        (Math.random() - 0.5) * 3,
                        colors[Math.floor(Math.random() * colors.length)]
                    ));
                }
            }
            
            draw() {
                if (!this.alive) return;
                
                // Draw trail
                const trailColor = rocketTypes[this.type].trailColor;
                this.trail.forEach((point, i) => {
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, 3 * point.alpha, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${hexToRgb(trailColor)}, ${point.alpha})`;
                    ctx.fill();
                });
                
                // Draw rocket emoji
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation + Math.PI / 2);
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(rocketTypes[this.type].emoji, 0, 0);
                ctx.restore();
                
                // Draw flame
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation + Math.PI / 2);
                const gradient = ctx.createRadialGradient(0, 30, 0, 0, 30, 20);
                gradient.addColorStop(0, 'rgba(255, 200, 100, 0.9)');
                gradient.addColorStop(0.5, 'rgba(255, 100, 50, 0.6)');
                gradient.addColorStop(1, 'rgba(255, 50, 50, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.ellipse(0, 35, 8, 15 + Math.random() * 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        // Particle class
        class Particle {
            constructor(x, y, type, vx = 0, vy = 0, color = '#ffffff') {
                this.x = x;
                this.y = y;
                this.type = type;
                this.vx = vx || (Math.random() - 0.5) * 2;
                this.vy = vy || (Math.random() - 0.5) * 2;
                this.alpha = 1;
                this.color = color;
                this.size = type === 'explosion' ? 4 : (type === 'sparkle' ? 3 : 8);
                this.life = type === 'smoke' ? 30 : 60;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.02;
                this.alpha -= 1 / this.life;
                this.size *= 0.98;
                return this.alpha > 0;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                
                if (this.type === 'smoke') {
                    ctx.fillStyle = `rgba(150, 150, 150, ${this.alpha * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'explosion') {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Glow effect
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                } else if (this.type === 'sparkle') {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    // Draw star shape
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
                        const x = this.x + Math.cos(angle) * this.size;
                        const y = this.y + Math.sin(angle) * this.size;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
            }
        }
        
        // Helper function to convert hex to rgb
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? 
                `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : 
                '255, 255, 255';
        }
        
        // Show celebration when hitting target
        function showCelebration(x, y) {
            // Play bullseye celebration sound
            AudioSystem.playBullseye();

            const text = document.createElement('div');
            text.className = 'explosion-text';
            text.textContent = '🎯 BULLSEYE! 🎉';
            text.style.left = x + 'px';
            text.style.top = y + 'px';
            text.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(text);
            
            setTimeout(() => text.remove(), 1000);
        }
        
        // Draw ground
        function drawGround() {
            const groundY = canvas.height - 50;
            
            // Grass gradient
            const gradient = ctx.createLinearGradient(0, groundY, 0, canvas.height);
            gradient.addColorStop(0, '#2d5a27');
            gradient.addColorStop(0.3, '#1e4d1a');
            gradient.addColorStop(1, '#0f2f0d');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, groundY, canvas.width, 50);
            
            // Grass blades
            ctx.strokeStyle = '#3a7a32';
            ctx.lineWidth = 2;
            for (let x = 0; x < canvas.width; x += 15) {
                const height = 10 + Math.random() * 10;
                ctx.beginPath();
                ctx.moveTo(x, groundY);
                ctx.quadraticCurveTo(x + 5, groundY - height, x, groundY - height - 5);
                ctx.stroke();
            }
        }
        
        // Draw launch pad
        function drawLaunchPad() {
            const padX = 100;
            const padY = canvas.height - 50;
            
            // Platform
            ctx.fillStyle = '#444';
            ctx.fillRect(padX - 40, padY - 20, 80, 20);
            
            // Support structure
            ctx.fillStyle = '#666';
            ctx.fillRect(padX - 5, padY - 80, 10, 60);
            
            // Launch flame effect when launching
            if (isLaunching) {
                const gradient = ctx.createRadialGradient(padX, padY, 0, padX, padY + 30, 40);
                gradient.addColorStop(0, 'rgba(255, 200, 50, 0.8)');
                gradient.addColorStop(0.5, 'rgba(255, 100, 0, 0.5)');
                gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.ellipse(padX, padY + 10, 30, 40, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Draw stars
        function drawStars() {
            const time = Date.now() / 1000;
            stars.forEach(star => {
                const twinkle = Math.sin(time * 3 + star.twinkle) * 0.5 + 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + twinkle * 0.7})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size * twinkle, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // Draw clouds
        function drawClouds() {
            clouds.forEach(cloud => {
                cloud.x += cloud.speed;
                if (cloud.x > canvas.width + cloud.width) {
                    cloud.x = -cloud.width;
                }
                
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.arc(
                        cloud.x + i * cloud.width * 0.3,
                        cloud.y + Math.sin(i) * 10,
                        cloud.width * 0.2,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
            });
        }
        
        // Draw target
        function drawTarget() {
            if (!target) return;
            
            const time = Date.now() / 500;
            const pulse = Math.sin(time) * 5 + 35;
            
            // Outer ring
            ctx.strokeStyle = '#ff4444';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(target.x, target.y, pulse, 0, Math.PI * 2);
            ctx.stroke();
            
            // Middle ring
            ctx.strokeStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(target.x, target.y, pulse * 0.6, 0, Math.PI * 2);
            ctx.stroke();
            
            // Inner ring
            ctx.strokeStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(target.x, target.y, pulse * 0.3, 0, Math.PI * 2);
            ctx.stroke();
            
            // Center dot
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(target.x, target.y, 5, 0, Math.PI * 2);
            ctx.fill();
            
            // Target emoji
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🎯', target.x, target.y - 50);
        }
        
        // Draw trajectory preview
        function drawTrajectoryPreview() {
            const power = document.getElementById('power').value;
            const angle = document.getElementById('angle').value;
            
            const startX = 100;
            const startY = canvas.height - 130;
            const radians = (90 - angle) * Math.PI / 180;
            const velocity = power * 0.15;
            let vx = Math.cos(radians) * velocity;
            let vy = -Math.sin(radians) * velocity;
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            
            let x = startX;
            let y = startY;
            ctx.moveTo(x, y);
            
            for (let i = 0; i < 100; i++) {
                vy += 0.05;
                x += vx;
                y += vy;
                
                if (y > canvas.height - 50) break;
                ctx.lineTo(x, y);
            }
            
            ctx.stroke();
            ctx.setLineDash([]);
        }
        
        // Update stats display
        function updateStats() {
            let currentAltitude = 0;
            let currentDistance = 0;
            let currentSpeed = 0;
            
            const activeRocket = rockets.find(r => r.alive);
            if (activeRocket) {
                currentAltitude = Math.max(0, Math.round(canvas.height - 50 - activeRocket.y));
                currentDistance = Math.round(activeRocket.x - activeRocket.startX);
                currentSpeed = Math.round(Math.hypot(activeRocket.vx, activeRocket.vy) * 10);
                
                if (currentAltitude > maxHeightReached) {
                    maxHeightReached = currentAltitude;
                }
            }
            
            document.getElementById('altitude').textContent = currentAltitude + ' m';
            document.getElementById('distance').textContent = currentDistance + ' m';
            document.getElementById('speed').textContent = currentSpeed + ' m/s';
            document.getElementById('maxHeight').textContent = maxHeightReached + ' m';
            document.getElementById('launches').textContent = launchCount;
        }
        
        // Main game loop
        function gameLoop() {
            // Clear canvas with gradient background
            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#0a0a2e');
            bgGradient.addColorStop(0.5, '#1a1a4e');
            bgGradient.addColorStop(0.8, '#2d1b4e');
            bgGradient.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw scene
            drawStars();
            drawClouds();
            drawGround();
            drawLaunchPad();
            drawTarget();
            drawTrajectoryPreview();
            
            // Update and draw rockets
            rockets.forEach(rocket => {
                rocket.update();
                rocket.draw();
            });
            
            // Remove dead rockets
            rockets = rockets.filter(r => r.alive || r.trail.length > 0);
            
            // Update and draw particles
            particles = particles.filter(p => {
                const alive = p.update();
                if (alive) p.draw();
                return alive;
            });
            
            // Update stats
            updateStats();
            
            // Reset launching state
            if (!rockets.some(r => r.alive)) {
                isLaunching = false;
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Launch rocket
        function launchRocket() {
            const power = parseInt(document.getElementById('power').value);
            const angle = parseInt(document.getElementById('angle').value);

            launchCount++;
            isLaunching = true;

            // Play launch sound
            AudioSystem.playLaunch();

            const rocket = new Rocket(100, canvas.height - 130, power, angle, selectedRocketType);
            rockets.push(rocket);
            
            // Disable button briefly
            const btn = document.getElementById('launchBtn');
            btn.disabled = true;
            setTimeout(() => btn.disabled = false, 1000);
        }
        
        // Countdown and launch
        function startCountdown() {
            let count = 3;
            const countdownDiv = document.createElement('div');
            countdownDiv.className = 'countdown';
            document.body.appendChild(countdownDiv);
            
            const countInterval = setInterval(() => {
                if (count > 0) {
                    countdownDiv.textContent = count;
                    AudioSystem.playCountdownBeep(count);
                    count--;
                } else {
                    countdownDiv.textContent = '🔥';
                    AudioSystem.playCountdownBeep(0);
                    setTimeout(() => {
                        countdownDiv.remove();
                        launchRocket();
                    }, 300);
                    clearInterval(countInterval);
                }
            }, 500);
        }
        
        // Event listeners
        document.getElementById('launchBtn').addEventListener('click', startCountdown);
        
        document.getElementById('power').addEventListener('input', (e) => {
            document.getElementById('powerValue').textContent = e.target.value + '%';
        });
        
        document.getElementById('angle').addEventListener('input', (e) => {
            document.getElementById('angleValue').textContent = e.target.value + '°';
        });
        
        // Rocket type selection
        document.querySelectorAll('.rocket-type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.rocket-type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRocketType = parseInt(btn.dataset.type);
            });
        });
        
        // Click to set target
        canvas.addEventListener('click', (e) => {
            if (e.clientY < canvas.height - 100 && e.clientX > 200) {
                target = { x: e.clientX, y: e.clientY };
            }
        });
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!document.getElementById('launchBtn').disabled) {
                    startCountdown();
                }
            }
        });
        
        // Start game
        gameLoop();
    </script>
</body>
</html>
